[project]
name = "ai-analytics"
version = "0.1.0"
description = "Ask questions about a CSV in plain English. Four LangGraph agents, from AI-written pandas code to validated JSON plans, plus a router that picks between them."
authors = [
    {name = "Jhon Trujillo",email = "amriikk@gmail.com"}
]
requires-python = ">=3.13,<4.0"
dependencies = [
    "pandas (>=3.0.6,<4.0.0)",
    "langgraph (>=1.2.11,<2.0.0)",
    "langchain (>=1.4.2,<2.0.0)",
    "langchain-anthropic (>=1.7.2,<2.0.0)",
    "fastapi (>=0.141.1,<0.142.0)",
    "uvicorn (>=0.53.0,<0.54.0)",
    "pydantic (>=2.13.5,<3.0.0)",
]

[tool.poetry]
package-mode = false

[tool.pytest.ini_options]
# Run from the repo root so "apps" and "libs" import the same way as in the app
pythonpath = ["."]
testpaths = ["tests"]

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[dependency-groups]
dev = [
    "pytest (>=9.2.0,<10.0.0)"
]
