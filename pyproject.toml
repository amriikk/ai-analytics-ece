[project]
name = "ai-analytics"
version = "0.1.0"
description = "An enterprise-grade monorepo featuring an iterative 4-phase AI analytics system with deterministic guardrails, stateful memory, and multi-agent orchestration."
authors = [
    {name = "amriikk",email = "amriikk@gmail.com"}
]
requires-python = ">=3.13,<4.0"
dependencies = [
    "pandas (>=3.0.6,<4.0.0)",
    "langgraph (>=1.2.11,<2.0.0)",
    "langchain (>=1.4.2,<2.0.0)",
    "langchain-anthropic (>=1.7.2,<2.0.0)",
    "fastapi (>=0.141.1,<0.142.0)",
    "uvicorn (>=0.53.0,<0.54.0)",
    "pydantic (>=2.13.5,<3.0.0)",
    "plotly (>=7.1.0,<8.0.0)"
]


[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"
